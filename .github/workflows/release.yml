name: Release

# 打一个形如 v1.2.3 的 tag 就会触发：
#   ① 校验 tag 与 manifest.json 的 version 一致（不一致直接失败，避免发错版本）
#   ② 跑门禁 + 打包
#   ③ 把 zip 与 build-info.json 作为 Release 附件上传
# 版本号自增请在本地用 `python ci.py --release patch` 完成后再打 tag。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（jsdom）
        run: npm install --no-audit --no-fund

      - name: 校验 tag 与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "tag=$TAG  manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag（$TAG）与 manifest.json 的 version（$MANIFEST）不一致，请先运行 python ci.py --release patch"
            exit 1
          fi

      - name: 跑门禁并打包
        run: python ci.py --out build

      - name: 上传 Release 附件
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/build-info.json
          generate_release_notes: true

      - name: 非 tag 触发时只留 artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sitefilter-release-candidate
          path: |
            build/*.zip
            build/build-info.json
