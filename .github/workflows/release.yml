name: Release

# 打一个形如 v1.2.3 的 tag 就会触发：
#   ① 校验 tag 与 manifest.json 的 version 一致（不一致直接失败，避免发错版本）
#   ② 跑门禁 + 打包
#   ③ 把 zip 与 build-info.json 作为 Release 附件上传
# 版本号自增请在本地用 `python ci.py --release patch` 完成后再打 tag。
#
# 这是**第二条**会红的路径（第一条是 ci.yml），所以两条的规矩必须一样：
#   · 唯一入口 `python ci.py`，不许自己拼测试命令；
#   · `npm ci` 而不是 `npm install` —— 后者在 CI 里会改写锁文件、也可能装出
#     与锁文件不同的版本，于是"发布包"和"门禁验过的包"来自两棵依赖树。
#     `_test_assembly.js` 会把 .github/workflows/ 下的每个 yml 都过一遍。
#   · 本机 node / python 与 ci.yml 对齐（22 / 3.12）：发布流程不该比门禁少验一层。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（jsdom，严格按锁文件）
        run: npm ci --no-audit --no-fund

      - name: 校验 tag 与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "tag=$TAG  manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag（$TAG）与 manifest.json 的 version（$MANIFEST）不一致，请先运行 python ci.py --release patch"
            exit 1
          fi

      - name: 跑门禁并打包
        run: python ci.py --out build

      - name: 上传 Release 附件
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/build-info.json
          generate_release_notes: true

      - name: 非 tag 触发时只留 artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sitefilter-release-candidate
          path: |
            build/*.zip
            build/build-info.json
